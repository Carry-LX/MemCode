<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">MemCode</title>
  <desc id="desc">MemCode: Discrete Semantic Representations for Long-Term Agent Memory. NeurIPS 2026 Poster.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d1f"/>
      <stop offset="0.58" stop-color="#121738"/>
      <stop offset="1" stop-color="#21114c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="4" y="4" width="1192" height="292" rx="28"/>
    </clipPath>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="4" y="4" width="1192" height="292" rx="28" fill="url(#bg)"/>
    <rect x="4" y="4" width="1192" height="292" fill="url(#grid)"/>
    <circle cx="1020" cy="44" r="150" fill="#7c3aed" opacity="0.24" filter="url(#blur)"/>
    <circle cx="1110" cy="260" r="124" fill="#06b6d4" opacity="0.16" filter="url(#blur)"/>
    <path d="M0 255 C210 180 330 315 520 230 S830 130 1200 205 V300 H0 Z" fill="url(#aurora)" opacity="0.28"/>

    <!-- Memory-chip mark -->
    <g transform="translate(70 75)">
      <rect x="0" y="0" width="126" height="126" rx="30" fill="url(#chip)" stroke="#334155" stroke-width="2"/>
      <rect x="20" y="20" width="86" height="86" rx="20" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
      <g stroke="url(#accent)" stroke-width="4" stroke-linecap="round">
        <path d="M38 40h16M72 40h16M38 63h16M72 63h16M38 86h16M72 86h16"/>
        <path d="M40 38v16M63 38v16M86 38v16M40 72v16M63 72v16M86 72v16"/>
      </g>
      <circle cx="63" cy="63" r="9" fill="#67e8f9" filter="url(#glow)"/>
    </g>

    <text x="232" y="131" fill="#f8fafc" font-family="Inter, Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="-3">Mem<tspan fill="#67e8f9">Code</tspan></text>
    <text x="235" y="174" fill="#dbeafe" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="500">Discrete Semantic Representations</text>
    <text x="235" y="204" fill="#a5b4fc" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="500">for Long-Term Agent Memory</text>

    <g transform="translate(234 222)">
      <rect width="226" height="36" rx="18" fill="#22d3ee" opacity="0.16" stroke="#22d3ee" stroke-opacity="0.45"/>
      <circle cx="18" cy="18" r="5" fill="#22d3ee"/>
      <text x="33" y="23" fill="#cffafe" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">NEURIPS 2026 · POSTER</text>
    </g>

    <!-- Codebook constellation -->
    <g transform="translate(930 46)" stroke-linecap="round">
      <g fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.62">
        <path d="M102 70 L164 34 L223 82 L204 160 L132 177 L65 130 Z"/>
        <path d="M102 70 L132 177M164 34 L132 177M223 82 L132 177M204 160 L102 70M65 130 L164 34M65 130 L223 82"/>
        <path d="M102 70 L223 82M164 34 L204 160M65 130 L132 177"/>
      </g>
      <g fill="#0f172a" stroke="url(#accent)" stroke-width="3">
        <circle cx="102" cy="70" r="15"/>
        <circle cx="164" cy="34" r="12"/>
        <circle cx="223" cy="82" r="14"/>
        <circle cx="204" cy="160" r="12"/>
        <circle cx="132" cy="177" r="16"/>
        <circle cx="65" cy="130" r="11"/>
      </g>
      <g fill="#67e8f9" filter="url(#glow)">
        <circle cx="102" cy="70" r="4"/>
        <circle cx="164" cy="34" r="3.5"/>
        <circle cx="223" cy="82" r="4"/>
        <circle cx="204" cy="160" r="3.5"/>
        <circle cx="132" cy="177" r="4.5"/>
        <circle cx="65" cy="130" r="3"/>
      </g>
      <circle cx="132" cy="102" r="27" fill="#111827" stroke="url(#accent)" stroke-width="3"/>
      <rect x="119" y="89" width="26" height="26" rx="7" fill="none" stroke="#a5f3fc" stroke-width="3"/>
      <path d="M119 96h-8M119 102h-8M119 108h-8M145 96h8M145 102h8M145 108h8" stroke="#a5f3fc" stroke-width="2.5"/>
      <text x="132" y="229" text-anchor="middle" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.05">1,024-CODE SEMANTIC SPACE</text>
    </g>
  </g>
  <rect x="4" y="4" width="1192" height="292" rx="28" fill="none" stroke="#3b4b75" stroke-width="1.5"/>
</svg>
