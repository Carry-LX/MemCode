<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">MemCode pipeline</title>
  <desc id="desc">Dialogue is converted into atomic memory units, indexed by dense embeddings and a discrete codebook, retrieved through both paths, and used to generate an evidence-grounded answer.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#64748b" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #dbe3f1; stroke-width: 1.5; }
      .label { fill: #0f172a; font: 700 17px Arial, Helvetica, sans-serif; }
      .sub { fill: #64748b; font: 12px Arial, Helvetica, sans-serif; }
      .tiny { fill: #64748b; font: 700 11px Arial, Helvetica, sans-serif; letter-spacing: 0.7px; }
      .step { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .stepnum { fill: #475569; font: 700 11px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #94a3b8; stroke-width: 2.2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #94a3b8; stroke-width: 2.2; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="368" rx="24" fill="url(#page)" stroke="#dfe6f2" stroke-width="2"/>
  <rect x="28" y="24" width="5" height="42" rx="2.5" fill="url(#accent)"/>
  <text x="48" y="43" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.5">MemCode pipeline</text>
  <text x="48" y="63" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Write → index → retrieve → answer</text>

  <g transform="translate(914 30)">
    <rect width="250" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe"/>
    <circle cx="18" cy="17" r="5" fill="#6366f1"/>
    <text x="31" y="21" fill="#4338ca" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DISCRETE ASSOCIATIVE MEMORY</text>
  </g>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect class="card" x="32" y="122" width="168" height="132" rx="18"/>
  </g>
  <g transform="translate(50 140)">
    <rect width="44" height="44" rx="12" fill="#e0f2fe"/>
    <text x="22" y="30" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Arial" font-size="22">💬</text>
  </g>
  <circle class="step" cx="46" cy="240" r="10"/><text class="stepnum" x="46" y="244">1</text>
  <text class="label" x="104" y="164">Dialogue</text>
  <text class="sub" x="50" y="205">Long-term sessions</text>
  <text class="sub" x="50" y="224">and interactions</text>

  <path class="arrow" d="M 200 188 H 228"/>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect class="card" x="232" y="122" width="190" height="132" rx="18"/>
  </g>
  <g transform="translate(250 140)">
    <rect width="44" height="44" rx="12" fill="#ede9fe"/>
    <text x="22" y="30" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Arial" font-size="22">🧩</text>
  </g>
  <circle class="step" cx="246" cy="240" r="10"/><text class="stepnum" x="246" y="244">2</text>
  <text class="label" x="304" y="164">Atomic units</text>
  <text class="sub" x="250" y="205">Source-grounded</text>
  <text class="sub" x="250" y="224">AMUs</text>

  <!-- Branch to two indexes -->
  <path class="branch" d="M 422 188 H 444 V 147 H 456"/>
  <path class="branch" d="M 444 188 V 232 H 456"/>
  <path class="arrow" d="M 456 147 H 462"/>
  <path class="arrow" d="M 456 232 H 462"/>

  <!-- Stage 3: dual index -->
  <g filter="url(#shadow)">
    <rect class="card" x="464" y="116" width="250" height="66" rx="15"/>
    <rect class="card" x="464" y="198" width="250" height="66" rx="15"/>
  </g>
  <g transform="translate(480 128)">
    <rect width="38" height="38" rx="10" fill="#dcfce7"/>
    <text x="19" y="27" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Arial" font-size="19">📦</text>
  </g>
  <text class="label" x="528" y="142" font-size="15">Vector store</text>
  <text class="sub" x="528" y="161">BGE dense embedding</text>
  <g transform="translate(480 210)">
    <rect width="38" height="38" rx="10" fill="#fce7f3"/>
    <text x="19" y="27" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Arial" font-size="19">🕸️</text>
  </g>
  <text class="label" x="528" y="224" font-size="15">Codebook index</text>
  <text class="sub" x="528" y="243">T5 VQ-VAE / ISQ</text>
  <circle class="step" cx="478" cy="288" r="10"/><text class="stepnum" x="478" y="292">3</text>
  <text class="tiny" x="496" y="292">DUAL MEMORY VIEW</text>

  <path class="arrow" d="M 714 149 H 746 V 188"/>
  <path class="arrow" d="M 714 231 H 746 V 188 H 748"/>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect class="card" x="748" y="122" width="180" height="132" rx="18"/>
  </g>
  <g transform="translate(766 140)">
    <rect width="44" height="44" rx="12" fill="#fef3c7"/>
    <text x="22" y="30" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Arial" font-size="22">🔀</text>
  </g>
  <circle class="step" cx="762" cy="240" r="10"/><text class="stepnum" x="762" y="244">4</text>
  <text class="label" x="820" y="164" font-size="16">Dual-path</text>
  <text class="sub" x="766" y="205">Dense + associative</text>
  <text class="sub" x="766" y="224">retrieval</text>

  <path class="arrow" d="M 928 188 H 964"/>

  <!-- Stage 5 -->
  <g filter="url(#shadow)">
    <rect class="card" x="966" y="122" width="202" height="132" rx="18"/>
  </g>
  <g transform="translate(984 140)">
    <rect width="44" height="44" rx="12" fill="#fee2e2"/>
    <text x="22" y="30" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Arial" font-size="22">🤖</text>
  </g>
  <circle class="step" cx="980" cy="240" r="10"/><text class="stepnum" x="980" y="244">5</text>
  <text class="label" x="1038" y="164" font-size="16">Answer</text>
  <text class="sub" x="984" y="205">Evidence back-filling</text>
  <text class="sub" x="984" y="224">and evaluation</text>

  <line x1="32" y1="316" x2="1168" y2="316" stroke="#e2e8f0"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">
    <circle cx="46" cy="340" r="5" fill="#0ea5e9"/><text x="58" y="344" fill="#475569">ONLINE WRITE</text>
    <circle cx="180" cy="340" r="5" fill="#8b5cf6"/><text x="192" y="344" fill="#475569">DISCRETE MEMORY</text>
    <circle cx="342" cy="340" r="5" fill="#ec4899"/><text x="354" y="344" fill="#475569">ASYNC CONSOLIDATION</text>
  </g>
</svg>
